<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RetekRéka ❤</title>
<style>
:root{--bg:#fff1f4;--card:#ffffff;--tx:#3a1f2b;--mut:#9a7684;--pink:#ff4d79;--soft:#ffd6e0;--line:#f3cdd8;--empty:#f4dbe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#24121a;--card:#341a25;--tx:#ffe9ef;--mut:#c799a8;--pink:#ff6b8f;--soft:#5a2a3b;--line:#4d2735;--empty:#4a2c38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#24121a;--card:#341a25;--tx:#ffe9ef;--mut:#c799a8;--pink:#ff6b8f;--soft:#5a2a3b;--line:#4d2735;--empty:#4a2c38}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{text-align:center;margin:6px 0 2px;font-size:2rem;color:var(--pink)}
.sub{text-align:center;color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 18px rgba(255,77,121,.12)}
h2{margin:0 0 10px;font-size:1.1rem}
.hearts{display:flex;gap:2px;justify-content:space-between}
.hearts button{flex:1;min-width:0;border:0;background:none;padding:0;cursor:pointer}
.hearts svg{width:100%;height:auto;display:block;fill:var(--empty);transition:fill .15s,transform .15s}
.hearts svg.on{fill:var(--pink)}
.hearts button:active svg{transform:scale(1.2)}
.bigheart{display:block;width:70%;max-width:220px;margin:6px auto 10px}.bigheart .bg{fill:var(--empty)}.bigheart .fg{fill:var(--pink)}input.sl{width:100%;height:28px;accent-color:var(--pink)}.row{margin-bottom:22px}.row:last-child{margin-bottom:0}
.lbl{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:4px}
.lbl b{font-weight:600}.lbl span{color:var(--mut)}
.msg{text-align:center;margin-top:10px;color:var(--pink);font-weight:600;min-height:1.4em}
.who{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.pill{border:2px solid var(--soft);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.pill.sel{background:var(--pink);border-color:var(--pink);color:#fff}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{border:0;background:var(--soft);color:var(--tx);border-radius:12px;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.cal-h strong{text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.72rem;color:var(--mut);padding:2px 0}
.day{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:var(--bg);color:var(--tx);font-size:.9rem;position:relative;cursor:pointer;padding:0}
.day.out{visibility:hidden}
.day.today{border-color:var(--pink)}
.day.sel{background:var(--soft)}
.day.met{background:var(--pink);color:#fff}
.day .dot{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pink)}
.day.met .dot{background:#fff}
.day .h{position:absolute;top:1px;right:3px;font-size:.6rem}
.panel{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.panel label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:600}
.panel input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink)}
.panel textarea{width:100%;border:2px solid var(--soft);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);resize:vertical;min-height:64px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:0;background:var(--soft);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.save{width:100%;border:0;background:var(--pink);color:#fff;border-radius:14px;padding:12px;font-size:1rem;font-weight:600;cursor:pointer}
.next{margin-top:12px;font-size:.9rem;color:var(--mut);text-align:center}
.note{text-align:center;font-size:.8rem;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<main>
<h1>RetekRéka ❤</h1>
<p class="sub">Pécs és köztünk a távolság – de a szívünk közel van.</p>

<section class="card">
  <h2>Mennyire hiányzol?</h2>
  <div class="who" id="who"></div>
  <div id="meters"></div>
  <div class="msg" id="msg"></div>
  <div class="note">Ha 30 percig nem nyúlsz a csúszkához, a hiány 10%-kal csökken.</div>
  <div class="note" id="syncnote"></div>
</section>

<section class="card">
  <h2>Közös naptár</h2>
  <div class="cal-h"><button id="prev" aria-label="Előző hónap">‹</button><strong id="title"></strong><button id="next" aria-label="Következő hónap">›</button></div>
  <div class="grid" id="grid"></div>
  <div class="next" id="nextmeet"></div>
  <div class="panel" id="panel" hidden>
    <strong id="ptitle"></strong>
    <label class="chk"><input type="checkbox" id="met"> Ezen a napon találkozunk ❤</label>
    <div class="chips" id="chips"></div>
    <textarea id="plan" placeholder="Mi a terv? (pl. focimeccs, tanulás, családi program)"></textarea>
    <div style="height:10px"></div>
    <button class="save" id="save">Mentés</button>
  </div>
</section>
</main>

<script>
(function(){
var NAMES={a:"Filius",b:"Réka"};
var MSGS=["Még nem nyomtál semmit 🙂","Egy kicsit hiányzol","Néha eszembe jutsz","Elég sokat gondolok rád","Nagyon hiányzol","Alig bírom ki nélküled","Hiányzol, mint a levegő 💞"];
var HEART='<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21.2 3.2 12.6C.6 10 .6 6 3.2 3.6c2.4-2.2 6-1.8 8 .6l.8 1 .8-1c2-2.4 5.6-2.8 8-.6 2.6 2.4 2.6 6.4 0 9L12 21.2z"/></svg>';
var CHIPS=["Focimeccs ⚽","Tanulás 📚","Családi program 👨‍👩‍👧","Séta 🚶","Mozi 🎬","Vacsora 🍝"];
var state={miss:{a:0,b:0},t:{},days:{}};var dragging=false;
function eff(k){var v=state.miss[k]||0,t=state.t&&state.t[k];if(!t)return v;return Math.max(0,v-10*Math.floor((Date.now()-t)/1800000))}
function commitMiss(k,x){dragging=false;var ts=Date.now();state.miss[k]=x;state.t=state.t||{};state.t[k]=ts;try{localStorage.setItem("rr_state",JSON.stringify(state))}catch(e){}
  if(base){lastWrite=Date.now();var u={};u["miss/"+k]=x;u["t/"+k]=ts;remote("PATCH","state",u).catch(function(){})}}
var me=null;try{me=localStorage.getItem("rr_me")}catch(e){}
var ref=null,sel=null,base=null,lastWrite=0;
var now=new Date();var vy=now.getFullYear(),vm=now.getMonth();

function pad(n){return n<10?"0"+n:""+n}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function load(){
  try{var s=localStorage.getItem("rr_state");if(s){var o=JSON.parse(s);if(o&&o.miss)state=o}}catch(e){}
}
function persist(){
  try{localStorage.setItem("rr_state",JSON.stringify(state))}catch(e){}
  if(ref){ref.set(state).catch(function(){})}
}

function renderWho(){
  var w=document.getElementById("who");w.innerHTML="<span style='color:var(--mut);font-size:.9rem;align-self:center'>Én vagyok:</span>";
  ["a","b"].forEach(function(k){
    var b=document.createElement("button");b.className="pill"+(me===k?" sel":"");b.textContent=NAMES[k];
    b.onclick=function(){me=k;try{localStorage.setItem("rr_me",k)}catch(e){}renderWho();renderMeters()};
    w.appendChild(b);
  });
}
function renderMeters(){
  var box=document.getElementById("meters");box.innerHTML="";
  ["a","b"].forEach(function(k){
    var v=eff(k);
    var row=document.createElement("div");row.className="row";
    var l=document.createElement("div");l.className="lbl";
    l.innerHTML="<b>"+NAMES[k]+(me===k?" (te)":"")+"</b><span class='pc'>"+v+"% hiány</span>";
    var P="M12 21.2 3.2 12.6C.6 10 .6 6 3.2 3.6c2.4-2.2 6-1.8 8 .6l.8 1 .8-1c2-2.4 5.6-2.8 8-.6 2.6 2.4 2.6 6.4 0 9L12 21.2z";
    var h=document.createElement("div");
    h.innerHTML='<svg class="bigheart" viewBox="0 0 24 22" aria-hidden="true"><defs><clipPath id="c'+k+'"><rect class="cr" x="0" width="24"/></clipPath></defs><path class="bg" d="'+P+'"/><path class="fg" clip-path="url(#c'+k+')" d="'+P+'"/></svg>';
    var cr=h.querySelector(".cr");
    function setH(x){cr.setAttribute("y",22-22*x/100);cr.setAttribute("height",22*x/100+0.5)}
    setH(v);
    var s=document.createElement("input");s.type="range";s.min=0;s.max=100;s.step=1;s.value=v;s.className="sl";
    s.setAttribute("aria-label",NAMES[k]+" hiánya százalékban");
    s.disabled=(me!==k);
    s.oninput=function(){dragging=true;var x=+s.value;setH(x);l.querySelector(".pc").textContent=x+"% hiány"};
    s.onchange=function(){commitMiss(k,+s.value);renderMeters()};
    s.onpointerup=function(){commitMiss(k,+s.value);renderMeters()};
    h.appendChild(s);
    row.appendChild(l);row.appendChild(h);box.appendChild(row);
  });
  var other=me==="a"?"b":me==="b"?"a":null;
  var m=document.getElementById("msg");
  if(!me){m.textContent="Válaszd ki, ki vagy, és nyomd meg a szíveket!"}
  else{var ov=eff(other);m.textContent=ov===0?NAMES[other]+" még nem jelölt semmit":NAMES[other]+": "+MSGS[Math.min(6,Math.ceil(ov*6/100))]}
}

function renderCal(){
  var months=["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
  document.getElementById("title").textContent=vy+". "+months[vm];
  var g=document.getElementById("grid");g.innerHTML="";
  ["H","K","Sze","Cs","P","Szo","V"].forEach(function(d){var e=document.createElement("div");e.className="dow";e.textContent=d;g.appendChild(e)});
  var first=(new Date(vy,vm,1).getDay()+6)%7,n=new Date(vy,vm+1,0).getDate();
  for(var i=0;i<first;i++){var e=document.createElement("div");e.className="day out";g.appendChild(e)}
  var t=key(now.getFullYear(),now.getMonth(),now.getDate());
  for(var d=1;d<=n;d++){(function(d){
    var k=key(vy,vm,d),info=state.days[k]||{};
    var b=document.createElement("button");
    b.className="day"+(info.met?" met":"")+(k===t?" today":"")+(k===sel?" sel":"");
    b.textContent=d;
    if(info.met){var h=document.createElement("span");h.className="h";h.textContent="❤";b.appendChild(h)}
    if(info.plan){var p=document.createElement("span");p.className="dot";b.appendChild(p)}
    b.onclick=function(){sel=k;openPanel();renderCal()};
    g.appendChild(b);
  })(d)}
  var up=Object.keys(state.days).filter(function(k){return state.days[k].met&&k>=t}).sort()[0];
  var nm=document.getElementById("nextmeet");
  if(up){var p=up.split("-");var diff=Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
    nm.textContent=diff===0?"Ma találkozunk! ❤":"Következő találkozó: "+(+p[1])+". hó "+(+p[2])+". – "+diff+" nap múlva ❤"}
  else nm.textContent="Jelölj be egy napot, amikor találkozunk!";
}
function openPanel(){
  var p=document.getElementById("panel");p.hidden=false;
  var info=state.days[sel]||{};var q=sel.split("-");
  document.getElementById("ptitle").textContent=q[0]+". "+(+q[1])+". "+(+q[2])+".";
  document.getElementById("met").checked=!!info.met;
  document.getElementById("plan").value=info.plan||"";
}
document.getElementById("chips").innerHTML=CHIPS.map(function(c){return '<button type="button" class="chip">'+esc(c)+'</button>'}).join("");
document.getElementById("chips").onclick=function(e){
  if(e.target.className!=="chip")return;var t=document.getElementById("plan");
  t.value=t.value?t.value+", "+e.target.textContent:e.target.textContent;
};
document.getElementById("save").onclick=function(){
  if(!sel)return;
  var met=document.getElementById("met").checked,plan=document.getElementById("plan").value.trim();
  if(!met&&!plan)delete state.days[sel];else state.days[sel]={met:met,plan:plan};
  saveDay(sel);renderCal();
  var b=document.getElementById("save");b.textContent="Mentve ❤";setTimeout(function(){b.textContent="Mentés"},1200);
};
document.getElementById("prev").onclick=function(){vm--;if(vm<0){vm=11;vy--}renderCal()};
document.getElementById("next").onclick=function(){vm++;if(vm>11){vm=0;vy++}renderCal()};

load();if(!state.t)state.t={};renderWho();renderMeters();renderCal();
setInterval(function(){if(!dragging)renderMeters()},30000);

// Közös szinkron (Firebase Realtime Database, REST)
var CANDS=["https://retekreka-e08e5-default-rtdb.firebaseio.com","https://retekreka-e08e5-default-rtdb.europe-west1.firebasedatabase.app","https://retekreka-e08e5-default-rtdb.asia-southeast1.firebasedatabase.app"];
var note=document.getElementById("syncnote"),lastJson="";
function remote(method,path,body){return fetch(base+"/"+path+".json",{method:method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)})}
function saveDay(k){
  try{localStorage.setItem("rr_state",JSON.stringify(state))}catch(e){}
  if(!base)return;lastWrite=Date.now();
  var v=state.days[k];
  (v?remote("PUT","state/days/"+k,v):remote("DELETE","state/days/"+k)).catch(function(){});
}
function pull(){
  if(!base||dragging||Date.now()-lastWrite<1500)return;
  fetch(base+"/state.json").then(function(r){return r.json()}).then(function(d){
    if(dragging||Date.now()-lastWrite<1500)return;
    d=d||{};var m=d.miss||{};
    var ns={miss:{a:m.a||0,b:m.b||0},t:d.t||{},days:d.days||{}};
    var j=JSON.stringify(ns);note.textContent="Közösen szinkronizálva ❤";
    if(j===lastJson)return;lastJson=j;state=ns;
    try{localStorage.setItem("rr_state",j)}catch(e){}
    renderMeters();renderCal();
  }).catch(function(){note.textContent="Nincs kapcsolat – próbálom újra…"});
}
function findBase(i){
  if(i>=CANDS.length){note.textContent="Nem érem el a közös adatbázist, ezért most csak ezen az eszközön ment.";return}
  var ac=new AbortController(),to=setTimeout(function(){ac.abort()},7000);
  fetch(CANDS[i]+"/state.json",{signal:ac.signal}).then(function(r){
    clearTimeout(to);if(!r.ok)throw 0;return r.json()
  }).then(function(){base=CANDS[i];pull();setInterval(pull,2000)}).catch(function(){clearTimeout(to);findBase(i+1)});
}
findBase(0);
})();
</script>
</body>
</html>
